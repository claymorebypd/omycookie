<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oh My Cookie | Handcrafted Cookies & Cakes Stockholm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- EmailJS Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("3KI9EiGAUzljTFtkV");
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FDF8F3;
            color: #4A3728;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #FDF8F3;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #D4A373;
            border-radius: 10px;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .no-scroll {
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const LANGUAGES = {
            en: {
                home: "Cookies",
                cakes: "Cakes",
                shop: "Order",
                about: "Our Story",
                contact: "Contact",
                cart: "Cart",
                heroTitle: "Baking Moments of Magic",
                heroSub: "Freshly baked handcrafted cookies and artisanal cakes delivered in Stockholm.",
                aboutHeroTitle: "Born from a Passion for Perfection",
                aboutHeroSub: "The journey of Oh My Cookie, from a small Stockholm kitchen to your favorite local treats.",
                storyTitle: "Our Stockholm Story",
                storyText1: "It all started with a simple obsession: finding the perfect balance between a crunchy edge and a gooey center. In our kitchen in Stockholm, we spent months testing flours, chocolates, and baking temperatures until we found 'The One'.",
                storyText2: "Today, Oh My Cookie is a celebration of craftsmanship. Every cookie and cake is hand-rolled and baked fresh daily using premium ingredients. We believe that a cookie isn't just a snack—it's a moment of joy.",

                confirmSwish: "I have Swish-ed",

                morning: "Morning (09:00 - 12:00)",
                afternoon: "Afternoon (13:00 - 17:00)",
                menu: "Menu"
            },
            sv: {
                home: "Kakor",
                cakes: "Tårtor",
                shop: "Beställ",
                about: "Vår Story",
                contact: "Kontakt",
                cart: "Varukorg",
                heroTitle: "Bakade med Magi",
                heroSub: "Nybakade handgjorda kakor och hantverksmässiga tårtor i Stockholm.",
                aboutHeroTitle: "Född ur en Passion för Perfektion",
                aboutHeroSub: "Resan för Oh My Cookie, från ett litet kök i Stockholm till dina lokala favoritgodsaker.",
                storyTitle: "Vår Stockholmsberättelse",
                storyText1: "Allt började med en enkel besatthet: att hitta den perfekta balansen mellan en krispig kant och ett segt inre. I vårt kök i Stockholm tillbringade vi månader med att testa mjöl, choklad och baktemperaturer tills vi hittade 'Den Rätta'.",
                storyText2: "Idag är Oh My Cookie en hyllning till hantverket. Varje kaka och tårta rullas för hand och bakas färskt dagligen med förstklassiga ingredienser. Vi tror att en kaka inte bara är ett mellanmål – det är ett ögonblick av glädje.",
                reviewTitle: "Älskar du våra kakor? Lämna en recension!",
                reviewSub: "Din feedback hjälper oss att finslipa varje sats. Skanna koden eller klicka på knappen nedan för att lämna en recension på Google.",
                writeReview: "Skriv en Google-recension",
                orderNow: "Beställ Nu",
                ourCookies: "Kollektionen",
                ourCakes: "Hantverksmässiga Tårtor",
                customBox: "Bygg din Box",
                addToCart: "Lägg i varukorg",
                total: "Totalt",
                checkout: "Kassa",
                delivery: "Innerstadsleverans (59 kr)",
                pickup: "Hämta i Butik (Gratis)",
                name: "Fullständigt Namn",
                email: "E-postadress",
                phone: "Telefonnummer",
                address: "Leveransadress",
                placeOrder: "Bekräfta Beställning",
                orderSuccess: "Beställning Lagd!",
                orderSuccessSub: "Kontrollera din e-post för bekräftelse.",
                boxSize: "Välj Boxstorlek",
                boxSelection: "Välj dina kakor",
                itemsRemaining: "kakor kvar att välja",
                emptyCart: "Varukorgen är tom",
                cookieTitle: "Cookie-policy",
                cookieSub: "Vi använder cookies för att förbättra din upplevelse.",
                accept: "Acceptera",
                close: "Stäng",
                swishMsg: "Skanna för att betala med Swish",
                confirmSwish: "Jag har Swishat",
                deliveryTime: "Leverans/Hämttid",
                morning: "Förmiddag (09:00 - 12:00)",
                afternoon: "Eftermiddag (13:00 - 17:00)",
                menu: "Meny"
            }
        };

        const MENU_ITEMS = [
            { id: 1, name_en: "Pistachio Dream", name_sv: "Pistagedröm", price: 45, emoji: "🍪", image: "images/cookies/pistachio.jpg", desc_en: "Roasted pistachios with white chocolate.", desc_sv: "Rostade pistagenötter med vit choklad." },
            { id: 2, name_en: "Classic Choc", name_sv: "Klassisk Choklad", price: 39, emoji: "🍫", image: "images/cookies/classic-choc.jpg", desc_en: "Double chocolate chunk perfection.", desc_sv: "Perfekt dubbel choklad." },
            { id: 3, name_en: "Red Velvet", name_sv: "Red Velvet", price: 42, emoji: "🍰", image: "images/cookies/red-velvet.jpg", desc_en: "Cream cheese filling with cocoa notes.", desc_sv: "Färskostfyllning med kakao." },
            { id: 4, name_en: "Biscoff Bliss", name_sv: "Biscoff Lycka", price: 45, emoji: "🍯", image: "images/cookies/biscoff.jpg", desc_en: "Lotus Biscoff stuffed cookie.", desc_sv: "Kaka fylld med Lotus Biscoff." },
            { id: 5, name_en: "Sea Salt Toffee", name_sv: "Havssaltkola", price: 42, emoji: "🧂", image: "images/cookies/toffee.jpg", desc_en: "Sweet toffee with a hint of salt.", desc_sv: "Söt kola med en nypa salt." },
            { id: 6, name_en: "Lemon Zest", name_sv: "Citron", price: 39, emoji: "🍋", image: "images/cookies/lemon.jpg", desc_en: "Refreshing citrus burst.", desc_sv: "Uppfriskande citrus-smak." }
        ];

        const CAKE_ITEMS = [
            { id: 'cake_1', name_en: "Kunafa Jar Cake", name_sv: "Kunafa Jar Cake", price: 85, emoji: "🍯", image: "images/cakes/kunafa-jar.jpg", desc_en: "Crunchy kunafa with sweet cream layers.", desc_sv: "Krispig kunafa med söta gräddlager." },
            { id: 'cake_2', name_en: "Saffron Tiramisu", name_sv: "Saffran Tiramisu", price: 95, emoji: "🍰", image: "images/cakes/saffron-tiramisu.jpg", desc_en: "Premium saffron infused mascarpone.", desc_sv: "Lyxig saffransinfunderad mascarpone." },
            { id: 'cake_3', name_en: "Dark Rum Cake", name_sv: "Mörk Romkaka", price: 120, emoji: "🍮", image: "images/cakes/dark-rum.jpg", desc_en: "Deep dark chocolate with premium rum.", desc_sv: "Djup mörk choklad med förstklassig rom." },
            { id: 'cake_4', name_en: "Strawberry Jar", name_sv: "Jordgubbs Jar", price: 75, emoji: "🍓", image: "images/cakes/strawberry-jar.jpg", desc_en: "Fresh strawberries and light sponge.", desc_sv: "Färska jordgubbar och lätt sockerkaka." }
        ];

        const BOX_OPTIONS = [
            { size: 6, price: 220, title_en: "Small Box (6)", title_sv: "Liten Box (6)" },
            { size: 12, price: 400, title_en: "Large Box (12)", title_sv: "Stor Box (12)" }
        ];

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name.toLowerCase()} style={{ width: size, height: size }} className={className}></i>;
        };

        const ProductImage = ({ src, emoji, alt }) => {
            const [error, setError] = useState(false);
            if (error || !src) {
                return (
                    <div className="w-full aspect-square bg-[#F0E4D8] rounded-[1.5rem] flex items-center justify-center text-5xl md:text-6xl select-none">
                        {emoji}
                    </div>
                );
            }
            return (
                <div className="w-full aspect-square relative overflow-hidden rounded-[1.5rem] bg-[#F0E4D8]">
                    <img 
                        src={src} 
                        alt={alt} 
                        className="product-image transition-transform duration-500 group-hover:scale-110"
                        onError={() => setError(true)}
                    />
                </div>
            );
        };

        const ReviewQRCode = () => {
            useEffect(() => {
                const qrContainer = document.getElementById("review-qrcode");
                if (qrContainer) {
                    qrContainer.innerHTML = ""; // Clear existing to prevent duplicates in React 18
                    new QRCode(qrContainer, {
                        text: "https://g.page/r/CWZv_BvtbH5gEBM/review",
                        width: 120,
                        height: 120,
                        colorDark: "#4A3728",
                        colorLight: "#ffffff"
                    });
                }
            }, []);
            return <div id="review-qrcode" className="p-3 bg-white border-4 border-[#FDF8F3] rounded-xl shadow-sm inline-block"></div>;
        };

        const App = () => {
            const [lang, setLang] = useState('en');
            const [view, setView] = useState('cookies'); 
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [selectedBoxSize, setSelectedBoxSize] = useState(null);
            const [currentBox, setCurrentBox] = useState([]);
            const [showCookieBanner, setShowCookieBanner] = useState(false);
            const [orderStep, setOrderStep] = useState('form'); 
            const [checkoutData, setCheckoutData] = useState({
                name: '', email: '', phone: '', method: 'pickup', address: '', time: 'morning'
            });

            useEffect(() => {
                const consent = localStorage.getItem('cookie-consent');
                if (!consent) setShowCookieBanner(true);
            }, []);

            useEffect(() => {
                if (isCartOpen || isCheckoutOpen || isMobileMenuOpen) {
                    document.body.classList.add('no-scroll');
                } else {
                    document.body.classList.remove('no-scroll');
                }
            }, [isCartOpen, isCheckoutOpen, isMobileMenuOpen]);

            const t = (key) => LANGUAGES[lang][key];

            const addToCart = (item) => {
                const existing = cart.find(i => i.id === item.id && !i.items);
                if (existing) {
                    setCart(cart.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i));
                } else {
                    setCart([...cart, { ...item, quantity: 1, name: item[`name_${lang}`] }]);
                }
                setIsCartOpen(true);
            };

            const addBoxToCart = () => {
                const opt = BOX_OPTIONS.find(b => b.size === selectedBoxSize);
                if (!opt) return;
                setCart([...cart, { 
                    id: Date.now(), 
                    name: opt[`title_${lang}`], 
                    items: [...currentBox], 
                    price: opt.price, 
                    quantity: 1 
                }]);
                setSelectedBoxSize(null);
                setCurrentBox([]);
                setIsCartOpen(true);
            };

            const removeFromCart = (id) => {
                setCart(cart.filter(i => i.id !== id));
            };

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 
                (checkoutData.method === 'delivery' ? 59 : 0);

            const sendConfirmationEmail = (orderId) => {
                const itemsList = cart.map(item => {
                    let text = `${item.name} (x${item.quantity}) - ${item.price * item.quantity} SEK`;
                    if (item.items && item.items.length > 0) {
                        const counts = item.items.reduce((acc, name) => { acc[name] = (acc[name] || 0) + 1; return acc; }, {});
                        const details = Object.entries(counts).map(([name, count]) => `   > ${count}x ${name}`).join('\n');
                        text += `\n${details}`;
                    }
                    return text;
                }).join('\n\n');

                const templateParams = {
                    to_name: "Oh My Cookie Admin",
                    customer_name: checkoutData.name,
                    customer_email: checkoutData.email,
                    customer_phone: checkoutData.phone,
                    order_id: orderId,
                    total_price: totalPrice,
                    delivery_method: checkoutData.method === 'pickup' ? 'Store Pickup' : 'Inner City Delivery',
                    delivery_address: checkoutData.method === 'pickup' ? 'N/A' : checkoutData.address,
                    delivery_time: checkoutData.time,
                    items_details: itemsList
                };
                return emailjs.send("service_t6r1r9b", "template_893j36h", templateParams);
            };

            const handleOrderSubmit = (e) => {
                e.preventDefault();
                setOrderStep('swish');
                setTimeout(() => {
                    const qrContainer = document.getElementById("qrcode");
                    if (qrContainer) qrContainer.innerHTML = "";
                    new QRCode(qrContainer, {
                        text: `C060000000000;${totalPrice};Oh My Cookie Order;0`,
                        width: 200, height: 200
                    });
                }, 100);
            };

            const finalizeOrder = async () => {
                const orderId = 'OMC-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                try {
                    await sendConfirmationEmail(orderId);
                    setOrderStep('success');
                    setCart([]);
                } catch (error) {
                    setOrderStep('success');
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="fixed top-0 w-full bg-white/90 backdrop-blur-md z-[50] border-b border-[#F0E4D8]">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex items-center justify-between">
                            <h1 onClick={() => setView('cookies')} className="text-xl md:text-2xl font-black tracking-tighter text-[#4A3728] cursor-pointer select-none">
                                OH MY COOKIE
                            </h1>
                            
                            <div className="flex items-center gap-2 md:gap-8">
                                <div className="hidden md:flex gap-8">
                                    <button onClick={() => setView('cookies')} className={`text-[10px] font-black uppercase tracking-widest transition-colors ${view === 'cookies' ? 'text-[#D4A373]' : 'text-[#4A3728] hover:text-[#D4A373]'}`}>{t('home')}</button>
                                    <button onClick={() => setView('cakes')} className={`text-[10px] font-black uppercase tracking-widest transition-colors ${view === 'cakes' ? 'text-[#D4A373]' : 'text-[#4A3728] hover:text-[#D4A373]'}`}>{t('cakes')}</button>
                                    <button onClick={() => setView('about')} className={`text-[10px] font-black uppercase tracking-widest transition-colors ${view === 'about' ? 'text-[#D4A373]' : 'text-[#4A3728] hover:text-[#D4A373]'}`}>{t('about')}</button>
                                </div>
                                
                                <div className="flex items-center gap-1 sm:gap-4">
                                    <button onClick={() => setLang(lang === 'en' ? 'sv' : 'en')} className="p-2 text-[10px] font-bold uppercase tracking-widest text-[#D4A373] hover:bg-[#FDF8F3] rounded-lg">
                                        {lang === 'en' ? 'SV' : 'EN'}
                                    </button>
                                    
                                    <button onClick={() => setIsCartOpen(true)} className="relative p-2 hover:bg-[#FDF8F3] rounded-lg transition-colors">
                                        <Icon name="ShoppingBag" />
                                        {cart.length > 0 && (
                                            <span className="absolute top-1 right-1 bg-[#D4A373] text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold shadow-sm">
                                                {cart.reduce((a, b) => a + b.quantity, 0)}
                                            </span>
                                        )}
                                    </button>

                                    <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden p-2 hover:bg-[#FDF8F3] rounded-lg transition-colors">
                                        <Icon name={isMobileMenuOpen ? "X" : "Menu"} />
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-white border-b border-[#F0E4D8] animate-slide-up">
                                <div className="flex flex-col p-4 gap-2">
                                    <button onClick={() => {setView('cookies'); setIsMobileMenuOpen(false)}} className={`p-4 text-left font-black uppercase tracking-widest rounded-xl ${view === 'cookies' ? 'bg-[#FDF8F3] text-[#D4A373]' : 'text-[#4A3728]'}`}>{t('home')}</button>
                                    <button onClick={() => {setView('cakes'); setIsMobileMenuOpen(false)}} className={`p-4 text-left font-black uppercase tracking-widest rounded-xl ${view === 'cakes' ? 'bg-[#FDF8F3] text-[#D4A373]' : 'text-[#4A3728]'}`}>{t('cakes')}</button>
                                    <button onClick={() => {setView('about'); setIsMobileMenuOpen(false)}} className={`p-4 text-left font-black uppercase tracking-widest rounded-xl ${view === 'about' ? 'bg-[#FDF8F3] text-[#D4A373]' : 'text-[#4A3728]'}`}>{t('about')}</button>
                                </div>
                            </div>
                        )}
                    </nav>

                    <header className="pt-32 pb-12 md:pb-20 px-4 text-center bg-[#FDF8F3]">
                        <div className="max-w-4xl mx-auto space-y-4 md:space-y-6 animate-slide-up">
                            <span className="inline-block px-4 py-1.5 bg-[#F0E4D8] text-[#4A3728] text-[9px] md:text-[10px] font-bold uppercase tracking-[0.2em] rounded-full">Stockholm, SE</span>
                            <h2 className="text-4xl md:text-7xl font-black leading-[1.1] text-[#4A3728] px-2">
                                {view === 'cookies' ? t('heroTitle') : view === 'about' ? t('aboutHeroTitle') : t('ourCakes')}
                            </h2>
                            <p className="text-base md:text-lg text-[#8C7A6B] max-w-xl mx-auto leading-relaxed px-4">
                                {view === 'about' ? t('aboutHeroSub') : t('heroSub')}
                            </p>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 pb-24 md:pb-32 space-y-16 md:space-y-24 w-full">
                        
                        {view === 'cookies' && (
                            <React.Fragment>
                                <section className="space-y-6 md:space-y-8 animate-slide-up">
                                    <div className="flex flex-col md:flex-row md:items-end justify-between border-b border-[#F0E4D8] pb-6 gap-2">
                                        <div>
                                            <h3 className="text-xl md:text-2xl font-black">{t('customBox')}</h3>
                                            <p className="text-[#8C7A6B] text-xs md:text-sm">{t('boxSize')}</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                                        {BOX_OPTIONS.map(opt => (
                                            <div key={opt.size} 
                                                 onClick={() => {setSelectedBoxSize(opt.size); setCurrentBox([])}}
                                                 className={`p-6 md:p-8 rounded-[1.5rem] md:rounded-[2rem] border-2 transition-all cursor-pointer flex justify-between items-center ${selectedBoxSize === opt.size ? 'border-[#4A3728] bg-white shadow-lg' : 'border-transparent bg-[#F0E4D8] hover:bg-[#EBDCCF]'}`}>
                                                <div className="space-y-1">
                                                    <h4 className="text-lg md:text-xl font-black">{opt[`title_${lang}`]}</h4>
                                                    <p className="font-bold text-[#D4A373] text-sm md:text-base">{opt.price} SEK</p>
                                                </div>
                                                <div className="w-10 h-10 md:w-12 md:h-12 rounded-full border-2 border-[#4A3728] flex items-center justify-center shrink-0">
                                                    {selectedBoxSize === opt.size && <div className="w-5 h-5 md:w-6 md:h-6 bg-[#4A3728] rounded-full" />}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {selectedBoxSize && (
                                        <div className="bg-white rounded-[1.5rem] md:rounded-[2.5rem] p-6 md:p-8 shadow-xl space-y-6 md:space-y-8 border border-[#F0E4D8] animate-slide-up overflow-hidden">
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                <h4 className="text-lg md:text-xl font-black">{t('boxSelection')}</h4>
                                                <span className="px-4 py-2 bg-[#FDF8F3] rounded-full text-[10px] md:text-xs font-bold whitespace-nowrap">
                                                    {selectedBoxSize - currentBox.length} {t('itemsRemaining')}
                                                </span>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 md:gap-4">
                                                {MENU_ITEMS.map(cookie => (
                                                    <button 
                                                        key={cookie.id}
                                                        disabled={currentBox.length >= selectedBoxSize}
                                                        onClick={() => setCurrentBox([...currentBox, cookie[`name_${lang}`]])}
                                                        className="p-4 rounded-xl md:rounded-2xl bg-[#FDF8F3] hover:bg-[#F0E4D8] transition-all text-center group disabled:opacity-40 active:scale-95"
                                                    >
                                                        <div className="text-2xl md:text-3xl mb-2 group-hover:scale-110 transition-transform">{cookie.emoji}</div>
                                                        <div className="text-[9px] md:text-[10px] font-black uppercase tracking-wider">{cookie[`name_${lang}`]}</div>
                                                    </button>
                                                ))}
                                            </div>
                                            {currentBox.length > 0 && (
                                                <div className="flex flex-wrap gap-2 py-2">
                                                    {currentBox.map((item, i) => (
                                                        <span key={i} className="px-3 py-1.5 bg-[#4A3728] text-white text-[9px] md:text-[10px] font-bold rounded-full flex items-center gap-2 animate-slide-up">
                                                            {item}
                                                            <button onClick={() => setCurrentBox(currentBox.filter((_, idx) => idx !== i))} className="p-0.5 hover:bg-white/20 rounded-full transition-colors">
                                                                <Icon name="X" size={10}/>
                                                            </button>
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                            <button 
                                                onClick={addBoxToCart}
                                                disabled={currentBox.length !== selectedBoxSize}
                                                className="w-full py-4 md:py-5 bg-[#4A3728] text-white rounded-xl md:rounded-2xl font-black uppercase tracking-widest disabled:opacity-50 active:scale-[0.98] transition-all text-xs md:text-sm"
                                            >
                                                {t('addToCart')}
                                            </button>
                                        </div>
                                    )}
                                </section>

                                <section className="space-y-6 md:space-y-8 animate-slide-up">
                                    <h3 className="text-xl md:text-2xl font-black border-b border-[#F0E4D8] pb-6">{t('ourCookies')}</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                                        {MENU_ITEMS.map(item => (
                                            <div key={item.id} className="bg-white p-6 md:p-8 rounded-[1.5rem] md:rounded-[2.5rem] border border-[#F0E4D8] hover:shadow-xl transition-all group flex flex-col h-full">
                                                <div className="mb-4 md:mb-6">
                                                    <ProductImage src={item.image} emoji={item.emoji} alt={item[`name_${lang}`]} />
                                                </div>
                                                <div className="space-y-3 md:space-y-4 flex-1 flex flex-col">
                                                    <div className="flex justify-between items-start gap-2">
                                                        <h4 className="text-lg md:text-xl font-black leading-tight">{item[`name_${lang}`]}</h4>
                                                        <span className="font-bold text-[#D4A373] whitespace-nowrap text-sm md:text-base">{item.price} SEK</span>
                                                    </div>
                                                    <p className="text-xs md:text-sm text-[#8C7A6B] leading-relaxed flex-1">{item[`desc_${lang}`]}</p>
                                                    <button 
                                                        onClick={() => addToCart(item)}
                                                        className="w-full py-3 md:py-4 bg-[#FDF8F3] group-hover:bg-[#4A3728] group-hover:text-white rounded-xl md:rounded-2xl font-black uppercase tracking-widest text-[10px] md:text-xs transition-all active:scale-95 mt-2"
                                                    >
                                                        {t('addToCart')}
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </React.Fragment>
                        )}

                        {view === 'cakes' && (
                            <section className="space-y-6 md:space-y-8 animate-slide-up">
                                <h3 className="text-xl md:text-2xl font-black border-b border-[#F0E4D8] pb-6">{t('ourCakes')}</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                                    {CAKE_ITEMS.map(item => (
                                        <div key={item.id} className="bg-white p-6 md:p-8 rounded-[1.5rem] md:rounded-[2.5rem] border border-[#F0E4D8] hover:shadow-xl transition-all group flex flex-col h-full">
                                            <div className="mb-4 md:mb-6">
                                                <ProductImage src={item.image} emoji={item.emoji} alt={item[`name_${lang}`]} />
                                            </div>
                                            <div className="space-y-3 md:space-y-4 flex-1 flex flex-col">
                                                <div className="flex justify-between items-start gap-2">
                                                    <h4 className="text-lg md:text-xl font-black leading-tight">{item[`name_${lang}`]}</h4>
                                                    <span className="font-bold text-[#D4A373] whitespace-nowrap text-sm md:text-base">{item.price} SEK</span>
                                                </div>
                                                <p className="text-xs md:text-sm text-[#8C7A6B] leading-relaxed flex-1">{item[`desc_${lang}`]}</p>
                                                <button 
                                                    onClick={() => addToCart(item)}
                                                    className="w-full py-3 md:py-4 bg-[#FDF8F3] group-hover:bg-[#4A3728] group-hover:text-white rounded-xl md:rounded-2xl font-black uppercase tracking-widest text-[10px] md:text-xs transition-all active:scale-95 mt-2"
                                                >
                                                    {t('addToCart')}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {view === 'about' && (
                            <div className="space-y-20 md:space-y-32">
                                <section className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center animate-slide-up">
                                    <div className="space-y-6">
                                        <h3 className="text-3xl md:text-4xl font-black tracking-tight">{t('storyTitle')}</h3>
                                        <p className="text-[#8C7A6B] text-base md:text-lg leading-relaxed">{t('storyText1')}</p>
                                        <p className="text-[#8C7A6B] text-base md:text-lg leading-relaxed">{t('storyText2')}</p>
                                    </div>
                                    <div className="aspect-square bg-[#F0E4D8] rounded-[2.5rem] flex items-center justify-center text-8xl md:text-9xl overflow-hidden relative group">
                                        <img src="images/about/kitchen.jpg" alt="Our Kitchen" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" onError={(e) => e.target.style.display='none'}/>
                                        <span className="absolute">🧑‍🍳</span>
                                    </div>
                                </section>

                                <section className="bg-white rounded-[2.5rem] md:rounded-[4rem] p-10 md:p-20 text-center space-y-8 md:space-y-12 border border-[#F0E4D8] animate-slide-up">
                                    <div className="max-w-2xl mx-auto space-y-4">
                                        <div className="w-16 h-16 bg-[#FDF8F3] rounded-2xl flex items-center justify-center mx-auto mb-6">
                                            <Icon name="Star" className="text-[#D4A373]" size={32} />
                                        </div>
                                        <h3 className="text-3xl md:text-5xl font-black tracking-tight">{t('reviewTitle')}</h3>
                                        <p className="text-[#8C7A6B] text-base md:text-lg">{t('reviewSub')}</p>
                                    </div>
                                    <div className="flex flex-col items-center gap-6">
                                        <ReviewQRCode />
                                        <a 
                                            href="https://g.page/r/CWZv_BvtbH5gEBM/review" 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="inline-block py-5 px-10 md:px-14 bg-[#4A3728] text-white rounded-2xl font-black uppercase tracking-widest hover:scale-105 active:scale-95 transition-all text-xs md:text-sm shadow-xl shadow-[#4A3728]/10"
                                        >
                                            {t('writeReview')}
                                        </a>
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    {isCartOpen && (
                        <div className="fixed inset-0 z-[100] overflow-hidden">
                            <div className="absolute inset-0 bg-[#4A3728]/20 backdrop-blur-sm transition-opacity" onClick={() => setIsCartOpen(false)} />
                            <div className="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col animate-slide-up md:translate-y-0">
                                <div className="p-5 md:p-6 border-b border-[#F0E4D8] flex justify-between items-center shrink-0">
                                    <h3 className="text-lg md:text-xl font-black uppercase tracking-widest">{t('cart')}</h3>
                                    <button onClick={() => setIsCartOpen(false)} className="p-2 hover:bg-[#FDF8F3] rounded-lg transition-colors">
                                        <Icon name="X" />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-5 md:p-6 space-y-6 custom-scrollbar">
                                    {cart.length === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-[#8C7A6B] space-y-4 py-20">
                                            <Icon name="ShoppingBag" size={48} className="opacity-20" />
                                            <p className="font-bold text-sm">{t('emptyCart')}</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex justify-between items-start animate-slide-up group">
                                                <div className="space-y-1 pr-4">
                                                    <h5 className="font-black text-sm uppercase leading-tight">{item.name} {item.quantity > 1 && <span className="text-[#D4A373]">x{item.quantity}</span>}</h5>
                                                    {item.items && (
                                                        <p className="text-[10px] text-[#8C7A6B] leading-tight">
                                                            {item.items.join(', ')}
                                                        </p>
                                                    )}
                                                    <p className="text-[#D4A373] font-bold text-xs">{item.price * item.quantity} SEK</p>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="p-2 bg-[#FDF8F3] text-red-400 rounded-lg hover:bg-red-50 hover:text-red-500 transition-colors shrink-0">
                                                    <Icon name="Trash2" size={14} />
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="p-5 md:p-6 bg-[#FDF8F3] space-y-4 shrink-0 border-t border-[#F0E4D8]">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-sm">{t('total')}</span>
                                            <span className="text-xl md:text-2xl font-black">{totalPrice} SEK</span>
                                        </div>
                                        <button 
                                            onClick={() => {setIsCartOpen(false); setIsCheckoutOpen(true)}}
                                            className="w-full py-4 md:py-5 bg-[#4A3728] text-white rounded-xl md:rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-all text-xs md:text-sm"
                                        >
                                            {t('checkout')}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {isCheckoutOpen && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center sm:p-4">
                            <div className="absolute inset-0 bg-[#4A3728]/40 backdrop-blur-md" onClick={() => setIsCheckoutOpen(false)} />
                            <div className="relative w-full h-full sm:h-auto sm:max-w-2xl bg-white sm:rounded-[2.5rem] md:rounded-[3rem] shadow-2xl overflow-hidden max-h-screen sm:max-h-[90vh] flex flex-col animate-slide-up">
                                <div className="p-6 md:p-8 border-b border-[#F0E4D8] flex justify-between items-center shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black uppercase tracking-tight">{t('checkout')}</h3>
                                    <button onClick={() => setIsCheckoutOpen(false)} className="p-2 hover:bg-[#FDF8F3] rounded-lg"><Icon name="X" /></button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar">
                                    {orderStep === 'form' && (
                                        <form onSubmit={handleOrderSubmit} className="space-y-6 md:space-y-8">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                                                <div className="space-y-1.5">
                                                    <label className="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-[#8C7A6B] ml-1">{t('name')}</label>
                                                    <input required className="w-full p-4 bg-[#FDF8F3] border-2 border-transparent focus:border-[#4A3728] rounded-xl transition-all outline-none text-sm" 
                                                           value={checkoutData.name} onChange={e => setCheckoutData({...checkoutData, name: e.target.value})} />
                                                </div>
                                                <div className="space-y-1.5">
                                                    <label className="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-[#8C7A6B] ml-1">{t('email')}</label>
                                                    <input required type="email" className="w-full p-4 bg-[#FDF8F3] border-2 border-transparent focus:border-[#4A3728] rounded-xl transition-all outline-none text-sm"
                                                           value={checkoutData.email} onChange={e => setCheckoutData({...checkoutData, email: e.target.value})} />
                                                </div>
                                                <div className="space-y-1.5">
                                                    <label className="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-[#8C7A6B] ml-1">{t('phone')}</label>
                                                    <input required className="w-full p-4 bg-[#FDF8F3] border-2 border-transparent focus:border-[#4A3728] rounded-xl transition-all outline-none text-sm"
                                                           value={checkoutData.phone} onChange={e => setCheckoutData({...checkoutData, phone: e.target.value})} />
                                                </div>
                                                <div className="space-y-1.5">
                                                    <label className="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-[#8C7A6B] ml-1">{t('deliveryTime')}</label>
                                                    <select className="w-full p-4 bg-[#FDF8F3] border-2 border-transparent focus:border-[#4A3728] rounded-xl transition-all outline-none font-bold text-sm appearance-none"
                                                            value={checkoutData.time} onChange={e => setCheckoutData({...checkoutData, time: e.target.value})}>
                                                        <option value="morning">{t('morning')}</option>
                                                        <option value="afternoon">{t('afternoon')}</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="space-y-4">
                                                <div className="flex flex-col sm:flex-row gap-3">
                                                    <button type="button" onClick={() => setCheckoutData({...checkoutData, method: 'pickup'})}
                                                            className={`flex-1 p-4 rounded-xl border-2 font-bold transition-all text-sm ${checkoutData.method === 'pickup' ? 'border-[#4A3728] bg-[#FDF8F3]' : 'border-transparent bg-[#F0E4D8]'}`}>
                                                        {t('pickup')}
                                                    </button>
                                                    <button type="button" onClick={() => setCheckoutData({...checkoutData, method: 'delivery'})}
                                                            className={`flex-1 p-4 rounded-xl border-2 font-bold transition-all text-sm ${checkoutData.method === 'delivery' ? 'border-[#4A3728] bg-[#FDF8F3]' : 'border-transparent bg-[#F0E4D8]'}`}>
                                                        {t('delivery')}
                                                    </button>
                                                </div>
                                                {checkoutData.method === 'delivery' && (
                                                    <div className="space-y-1.5 animate-slide-up">
                                                        <label className="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-[#8C7A6B] ml-1">{t('address')}</label>
                                                        <textarea required className="w-full p-4 bg-[#FDF8F3] border-2 border-transparent focus:border-[#4A3728] rounded-xl transition-all outline-none text-sm h-24 resize-none"
                                                                  value={checkoutData.address} onChange={e => setCheckoutData({...checkoutData, address: e.target.value})} />
                                                    </div>
                                                )}
                                            </div>

                                            <div className="p-6 md:p-7 bg-[#4A3728] rounded-2xl md:rounded-[2rem] text-white flex flex-col sm:flex-row justify-between items-center gap-4">
                                                <div className="text-center sm:text-left">
                                                    <p className="text-[9px] opacity-60 font-black uppercase tracking-widest">{t('total')}</p>
                                                    <p className="text-2xl md:text-3xl font-black">{totalPrice} SEK</p>
                                                </div>
                                                <button type="submit" className="w-full sm:w-auto bg-white text-[#4A3728] px-8 py-4 rounded-xl font-black uppercase tracking-widest text-xs hover:scale-105 active:scale-95 transition-all">
                                                    {t('placeOrder')}
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    {orderStep === 'swish' && (
                                        <div className="text-center space-y-8 animate-slide-up py-4">
                                            <div className="space-y-2">
                                                <h4 className="text-xl md:text-2xl font-black">{t('swishMsg')}</h4>
                                                <p className="text-[#8C7A6B] font-bold text-base md:text-lg">{totalPrice} SEK</p>
                                            </div>
                                            <div className="flex justify-center">
                                                <div id="qrcode" className="p-4 bg-white border-4 md:border-8 border-[#FDF8F3] rounded-[1.5rem] md:rounded-[2rem]"></div>
                                            </div>
                                            <button onClick={finalizeOrder} className="w-full py-4 md:py-5 bg-[#4A3728] text-white rounded-xl md:rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-all text-xs md:text-sm">
                                                {t('confirmSwish')}
                                            </button>
                                        </div>
                                    )}

                                    {orderStep === 'success' && (
                                        <div className="text-center py-10 md:py-16 space-y-6 animate-slide-up">
                                            <div className="w-20 h-20 md:w-24 md:h-24 bg-[#D4A373] text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl">
                                                <Icon name="Check" size={40} />
                                            </div>
                                            <h4 className="text-3xl md:text-4xl font-black tracking-tight">{t('orderSuccess')}</h4>
                                            <p className="text-[#8C7A6B] text-base md:text-lg px-4">{t('orderSuccessSub')}</p>
                                            <button onClick={() => setIsCheckoutOpen(false)} className="px-10 py-4 border-2 border-[#4A3728] rounded-xl md:rounded-2xl font-black uppercase tracking-widest text-[10px] md:text-xs active:scale-95 transition-all mt-4">
                                                {t('close')}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showCookieBanner && (
                        <div className="fixed bottom-0 inset-x-0 z-[120] p-4 pointer-events-none">
                            <div className="max-w-xl mx-auto bg-[#4A3728] pointer-events-auto p-5 md:p-8 rounded-[1.5rem] md:rounded-[2.5rem] shadow-2xl text-white space-y-5 md:space-y-6 animate-slide-up border border-white/5">
                                <div className="flex gap-4">
                                    <div className="bg-[#D4A373] p-3 rounded-xl md:rounded-2xl h-fit shrink-0">
                                        <Icon name="Cookie" size={20} className="text-[#4A3728]" />
                                    </div>
                                    <div className="space-y-1">
                                        <h3 className="font-black text-base md:text-xl leading-none">{t('cookieTitle')}</h3>
                                        <p className="text-[10px] md:text-[11px] text-[#A09184] leading-relaxed">{t('cookieSub')}</p>
                                    </div>
                                </div>
                                <div className="flex gap-2 md:gap-3">
                                    <button onClick={() => {localStorage.setItem('cookie-consent', 'true'); setShowCookieBanner(false)}} 
                                            className="flex-1 py-3 md:py-4 bg-white text-[#4A3728] rounded-xl font-black text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-[#D4A373] hover:text-white transition-all active:scale-95">
                                        {t('accept')}
                                    </button>
                                    <button onClick={() => setShowCookieBanner(false)} 
                                            className="px-4 md:px-6 py-3 md:py-4 bg-white/10 rounded-xl font-black text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-white/20 transition-all active:scale-95">
                                        {t('close')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-white border-t border-[#F0E4D8] py-12 px-4 text-center mt-auto">
                        <div className="max-w-7xl mx-auto space-y-6">
                             <h1 className="text-xl font-black tracking-tighter text-[#4A3728]">OH MY COOKIE</h1>
                             <div className="flex justify-center gap-6 text-[#8C7A6B]">
                                 <Icon name="Instagram" className="hover:text-[#4A3728] transition-colors cursor-pointer" />
                                 <Icon name="Facebook" className="hover:text-[#4A3728] transition-colors cursor-pointer" />
                                 <Icon name="Mail" className="hover:text-[#4A3728] transition-colors cursor-pointer" />
                             </div>
                             <p className="text-[10px] font-bold uppercase tracking-widest text-[#A09184]">© 2024 Oh My Cookie Stockholm</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
